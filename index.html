<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paidrex - Smart Finance. Simplified.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #11101a;
            color: #17162b;
        }

        .page {
            width: min(1200px, 94%);
            margin: 30px auto;
            background: white;
            overflow: hidden;
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
        }

        /* HEADER */

        header {
            min-height: 90px;
            padding: 20px 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eeeeF5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 25px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg,#6848ff,#3521a7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .tagline {
            color: #77758a;
            font-size: 14px;
        }

        .month {
            color: #6848ff;
            font-size: 14px;
            font-weight: bold;
        }

        /* WEB SECTION */

        .web-section {
            min-height: 560px;
            padding: 75px 70px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 50px;

            background:
                radial-gradient(
                    circle at 80% 30%,
                    rgba(105,73,255,.10),
                    transparent 35%
                ),
                white;
        }

        .label {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 30px;
            background: #f0edff;
            color: #6645e9;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px,5vw,68px);
            line-height: 1.02;
            letter-spacing: -3px;
        }

        h1 span {
            color: #6546ec;
        }

        .web-text p {
            max-width: 520px;
            margin-top: 24px;
            color: #77758a;
            line-height: 1.7;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 27px;
        }

        .feature {
            padding: 10px 13px;
            border: 1px solid #e9e7f2;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
        }

        .feature span {
            color: #6243e8;
        }

        .btn {
            border: none;
            padding: 15px 22px;
            border-radius: 10px;
            margin-top: 28px;
            background: #6546ed;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #5032d2;
        }

        /* LAPTOP */

        .laptop-area {
            display: flex;
            justify-content: center;
        }

        .laptop {
            width: min(480px,100%);
            transform: perspective(1000px) rotateY(-7deg) rotateX(3deg);
        }

        .screen {
            height: 290px;
            border: 9px solid #25233a;
            background: #10101a;
            border-radius: 14px 14px 5px 5px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(25,22,54,.25);
        }

        .browser {
            height: 28px;
            background: #29273b;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 12px;
        }

        .browser span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #77758b;
        }

        .code {
            padding: 30px;
            font-family: monospace;
            color: #ddd;
            line-height: 1.8;
            font-size: 14px;
        }

        .purple {
            color: #a98bff;
        }

        .blue {
            color: #63a8ff;
        }

        .indent {
            margin-left: 25px;
        }

        .indent2 {
            margin-left: 50px;
        }

        .laptop-base {
            height: 16px;
            width: 110%;
            margin-left: -5%;
            background: linear-gradient(#c6c6d0,#81818f);
            border-radius: 0 0 12px 12px;
        }

        /* CRYPTO */

        .crypto-section {
            min-height: 560px;
            padding: 70px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;

            color: white;

            background: linear-gradient(
                135deg,
                #17152e,
                #25204c
            );
        }

        .crypto-section .label {
            background: rgba(137,111,255,.15);
            color: #b9a8ff;
        }

        .crypto-section h2 {
            font-size: clamp(38px,4vw,58px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .crypto-section h2 span {
            color: #9b84ff;
        }

        .crypto-section p {
            max-width: 480px;
            margin-top: 22px;
            color: #bbb7d0;
            line-height: 1.7;
        }

        .coins {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
